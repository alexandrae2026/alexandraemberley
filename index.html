<script>
(function () {
  var clips = document.querySelectorAll('video.clip');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!clips.length || still || !('IntersectionObserver' in window)) return;
  var seen = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.play().catch(function () {}); }
      else { e.target.pause(); }
    });
  }, { threshold: 0.35 });
  clips.forEach(function (v) { seen.observe(v); });
})();
document.querySelectorAll('video.clip').forEach(function (v) {
  function toggle() { if (v.paused) { v.play().catch(function () {}); } else { v.pause(); } }
  v.addEventListener('click', toggle);
  v.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
});
</script>
